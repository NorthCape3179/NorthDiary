name: Android alpha
on:
  push:
    branches: [main, 'android/**']
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NORTHDIARY_DEBUG_KEYSTORE: ${{ github.workspace }}/.android-signing/debug.keystore
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/cache@v4
        with:
          path: ${{ env.NORTHDIARY_DEBUG_KEYSTORE }}
          key: northdiary-android-debug-v2
      - name: Prepare reusable debug signing key
        run: |
          mkdir -p "$(dirname "$NORTHDIARY_DEBUG_KEYSTORE")"
          if [ ! -f "$NORTHDIARY_DEBUG_KEYSTORE" ]; then
            keytool -genkeypair -keystore "$NORTHDIARY_DEBUG_KEYSTORE" -alias androiddebugkey -storepass android -keypass android -dname "CN=Android Debug,O=NorthDiary,C=CN" -keyalg RSA -validity 10000
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: NorthDiary-android-0.1.3-alpha
          path: android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
  device-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: pixel_2
            api: 34
          - profile: pixel_c
            api: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          working-directory: android
          script: |
            adb shell settings put secure show_ime_with_hard_keyboard 1
            gradle --no-daemon :app:connectedDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.northcape.northdiary/.MainActivity
            sleep 2
            mkdir -p screenshots
            adb exec-out screencap -p > screenshots/home.png
            adb pull /sdcard/Pictures/NorthDiaryQA screenshots/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-reports-${{ matrix.profile }}
          path: |
            android/app/build/reports/androidTests/
            android/screenshots/
